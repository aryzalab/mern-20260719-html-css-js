<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .flex-box {
        border: 1px solid;
        gap: 1rem;
        display: flex;
        flex-wrap: wrap;
      }

      .card {
        height: 100px;
        width: 100px;
        background-color: blueviolet;
        flex-grow: 1;
        flex-shrink: 1;
      }

      .card:first-child {
        flex-grow: 3;
        flex-shrink: 0.7;
      }

      h1::before {
        content: "Hi! ";
      }

      h1::after {
        content: " Welcome";
      }
    </style>
  </head>
  <body>
    <div class="flex-box">
      <div class="card one"></div>
      <div class="card two"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
    </div>

    <h1>Hello world</h1>
  </body>
</html>
